[package]
name = "intelligent-pascal"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity High-Performance Genomics"]
description = "Ultra-fast, low-memory de novo genome assembler designed for modern multi-core SIMD hardware"

[dependencies]
rayon = "1.10"
flate2 = "1.0"
hashbrown = { version = "0.15", features = ["rayon"] }
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
