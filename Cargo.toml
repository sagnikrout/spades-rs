[package]
name = "spades-rs"
version = "1.0.0"
edition = "2021"
authors = ["Sagnik Rout <sagnikrout@users.noreply.github.com>", "Gemini 3.8 Flash (Google DeepMind)"]
description = "A Rust-based de novo genome assembler designed for low-memory environments"
repository = "https://github.com/sagnikrout/spades-rs"
readme = "README.md"
license = "MIT"
keywords = ["bioinformatics", "genomics", "genome-assembler", "spades", "de-novo"]

[lib]
name = "spades_rs"
path = "src/lib.rs"

[[bin]]
name = "spades-rs"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
flate2 = "1.0"
hashbrown = { version = "0.15", features = ["rayon"] }
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
