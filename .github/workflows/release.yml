name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 statically linked (musl) - runs anywhere
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: intelligent-pascal-linux-x86_64-musl
            use_cross: true
          # Linux aarch64 (ARM64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: intelligent-pascal-linux-arm64
            use_cross: true
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: intelligent-pascal-macos-arm64
            use_cross: false
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: intelligent-pascal-windows-x86_64.exe
            use_cross: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare binary artifact
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/intelligent-pascal"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/intelligent-pascal.exe"
            cp "$BIN_PATH" "${{ matrix.artifact_name }}"
          else
            strip "$BIN_PATH" || true
            cp "$BIN_PATH" "${{ matrix.artifact_name }}"
          fi
          sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
